[package]
authors = ["madetara x@madetara.dev"]
name = "ttembedder"
version = "0.1.1"
edition = "2024"
publish = false

[[bin]]
bench = false
name = "ttembedder"
test = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
openssl-probe = "0.1"
opentelemetry = "0.31"
opentelemetry-appender-tracing = "0.31"
opentelemetry-otlp = { version = "0.31", features = [
    "grpc-tonic",
    "tls",
    "tls-roots",
] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-stdout = { version = "0.31.0", features = ["trace"] }
teloxide = { version = "0.17.0", default-features = false, features = [
    "ctrlc_handler",
    "macros",
    "webhooks-axum",
    "rustls",
] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-futures = "0.2"
tracing-opentelemetry = "0.32"
tracing-subscriber = "0.3"
tokio = { version = "1.48", features = [
    "rt-multi-thread",
    "macros",
    "process",
] }
tonic = { version = "0.14", features = ["tls-native-roots"] }
url = "2.5"
uuid = "1.19"

[lints.clippy]
all = "deny"
pedantic = "warn"
nursery = "warn"
cargo = "allow"
